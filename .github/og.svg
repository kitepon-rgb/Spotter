<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Crosshair / spotter mark -->
  <g transform="translate(960, 130)" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.85">
    <circle cx="0" cy="0" r="50"/>
    <circle cx="0" cy="0" r="22" stroke-dasharray="3 3"/>
    <line x1="-70" y1="0" x2="-58" y2="0"/>
    <line x1="58" y1="0" x2="70" y2="0"/>
    <line x1="0" y1="-70" x2="0" y2="-58"/>
    <line x1="0" y1="58" x2="0" y2="70"/>
    <circle cx="0" cy="0" r="3" fill="#f59e0b"/>
  </g>

  <!-- Project name -->
  <text x="80" y="190" fill="#ffffff" font-size="120" font-weight="700" letter-spacing="-3">Spotter</text>

  <!-- Pitch (Japanese) -->
  <text x="80" y="280" fill="#e2e8f0" font-size="40" font-weight="500">気づく役と実行する役を分離する</text>

  <!-- Pitch (English) -->
  <text x="80" y="335" fill="#94a3b8" font-size="28" font-weight="400">Audit agent for Claude Code · catches missed tool calls</text>

  <!-- Bullets -->
  <g transform="translate(80, 420)" font-size="22" fill="#cbd5e1">
    <g>
      <circle cx="8" cy="-7" r="4" fill="#f59e0b"/>
      <text x="28" y="0" font-weight="500">Your Claude answers, Spotter watches in parallel</text>
    </g>
    <g transform="translate(0, 38)">
      <circle cx="8" cy="-7" r="4" fill="#f59e0b"/>
      <text x="28" y="0" font-weight="500">MCP / skills / sub-agents auto-cataloged</text>
    </g>
    <g transform="translate(0, 76)">
      <circle cx="8" cy="-7" r="4" fill="#f59e0b"/>
      <text x="28" y="0" font-weight="500">Hooks-driven, no Claude awareness needed</text>
    </g>
  </g>

  <!-- Footer band -->
  <rect x="0" y="580" width="1200" height="50" fill="#000000" opacity="0.3"/>
  <text x="80" y="613" fill="#94a3b8" font-size="20" font-weight="400">github.com/kitepon/Spotter  ·  npm i -g claude-spotter</text>
  <text x="1120" y="613" fill="#94a3b8" font-size="20" font-weight="400" text-anchor="end">MIT</text>
</svg>
