<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <radialGradient id="bellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bellFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b4f7a"/>
      <stop offset="100%" stop-color="#2a3855"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Primary Claude side (left) — the doer, solid -->
  <circle cx="340" cy="240" r="180" fill="url(#bellGlow)"/>
  <g transform="translate(280, 180)">
    <!-- Solid blue cube representing "executes / answers" -->
    <polygon points="0,40 60,0 120,40 120,120 60,160 0,120" fill="url(#bellFill)" stroke="#5b7bbf" stroke-width="2"/>
    <polygon points="0,40 60,0 60,80 0,120" fill="#4a6398" opacity="0.7"/>
    <polygon points="60,0 120,40 120,120 60,80" fill="#3a5085" opacity="0.7"/>
    <!-- Label dot -->
    <circle cx="60" cy="-30" r="4" fill="#5b7bbf"/>
  </g>

  <!-- Connecting thread (amber, thin) -->
  <line x1="460" y1="240" x2="740" y2="240" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="600" cy="240" r="3" fill="#f59e0b" opacity="0.9"/>

  <!-- Spotter side (right) — the auditor, wireframe + crosshair -->
  <circle cx="860" cy="240" r="180" fill="url(#spotterGlow)"/>
  <g transform="translate(800, 180)">
    <!-- Wireframe cube representing "watches / audits" -->
    <polygon points="0,40 60,0 120,40 120,120 60,160 0,120" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="60" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="120" y1="40" x2="60" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="60" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Crosshair / spotter mark inside the wireframe box -->
    <g transform="translate(60, 80)" stroke="#f59e0b" stroke-width="1.8" fill="none" opacity="0.95">
      <circle cx="0" cy="0" r="32"/>
      <circle cx="0" cy="0" r="14" stroke-dasharray="2 3"/>
      <line x1="-44" y1="0" x2="-36" y2="0"/>
      <line x1="36" y1="0" x2="44" y2="0"/>
      <line x1="0" y1="-44" x2="0" y2="-36"/>
      <line x1="0" y1="36" x2="0" y2="44"/>
      <circle cx="0" cy="0" r="2" fill="#f59e0b"/>
    </g>
    <!-- Label dot -->
    <circle cx="60" cy="-30" r="4" fill="#f59e0b"/>
  </g>
</svg>
